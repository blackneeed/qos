[build]
target = "compiletime/target.json"

[profile.release]
debug = true
opt-level = 0

[target.'cfg(all())']
rustflags = ["-C", "link-arg=-Tcompiletime/linker.ld"]

[target.'cfg(target_os = "none")']
runner = "scripts/run.sh"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
